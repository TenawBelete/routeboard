# BGP pipeline - stages 1-2b: broker, producer, object storage, Spark streaming job,
# serving database, nightly maintenance.
# The same file runs on the laptop and on the server; only .env differs.
# Every port is bound to 127.0.0.1, so nothing is reachable from outside
# the machine. Public access is added later through a reverse proxy.

name: bgp-pipeline

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v24.2.7}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=${REDPANDA_MEMORY:-1G}
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API for tools running on the host
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Creates the topic once, with retention caps so disk use stays bounded.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v24.2.7}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic describe "${KAFKA_TOPIC}" -X brokers=redpanda:9092 >/dev/null 2>&1 \
        || rpk topic create "${KAFKA_TOPIC}" \
             --partitions 3 \
             --topic-config retention.ms=${TOPIC_RETENTION_MS:-21600000} \
             --topic-config retention.bytes=${TOPIC_RETENTION_BYTES:-1073741824} \
             -X brokers=redpanda:9092
    restart: "no"

  # S3-compatible object storage for the lake (bronze/silver/gold Delta tables). One process runs master + volume + filer + S3 gateway.
  # Credentials come from s3/config.json, rendered from .env by s3-init.
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-3.80}
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowEmptyFolder=false
    ports:
      - "127.0.0.1:8333:8333"   # S3 API for tools on the host (aws cli, etc.)
      - "127.0.0.1:9333:9333"   # Master UI
    volumes:
      - lake-data:/data
      - s3-config:/etc/seaweedfs:ro
    depends_on:
      s3-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || wget -qO- --server-response http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Writes the S3 credentials file from .env so the secret never lives in git.
  s3-config:
    image: alpine:3.20
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3-config:/out
    command:
      - /bin/sh
      - -c
      - |
        set -e
        test -n "$$S3_ACCESS_KEY" -a -n "$$S3_SECRET_KEY" || { echo "S3_ACCESS_KEY / S3_SECRET_KEY missing in .env"; exit 1; }
        cat > /out/s3.json <<JSON
        {"identities":[{"name":"pipeline","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        echo "s3.json written"
    restart: "no"

  # Creates the buckets once (idempotent).
  s3-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for b in lake; do
          aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b
        done
        aws --endpoint-url http://seaweedfs:8333 s3 ls
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Applies postgres/init/*.sql on every start. Every statement is idempotent,
  # so this also upgrades a database that already exists from an earlier stage.
  db-migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./postgres/init:/init:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["for f in /init/*.sql; do psql -v ON_ERROR_STOP=1 -q -f \"$$f\" || exit 1; done"]
    restart: "no"

  # Spark Structured Streaming: Kafka -> Delta (bronze, silver) -> Postgres (gold).
  # The first start downloads connector jars (about 1-2 minutes), cached afterwards.
  spark: &spark-base
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    user: root
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    environment: &spark-env
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_PATH: s3a://lake
      CHECKPOINT_PATH: /data/checkpoints/ingest   # local: Spark checkpoints need a real filesystem
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-30}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-50000}
      RETENTION_BRONZE_DAYS: ${RETENTION_BRONZE_DAYS:-3}
      RETENTION_SILVER_DAYS: ${RETENTION_SILVER_DAYS:-14}
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[2]
      - --driver-memory=${SPARK_DRIVER_MEMORY:-2g}
      - --driver-java-options=-Duser.timezone=UTC
      - --conf=spark.jars.ivy=/tmp/ivy
      - --packages=${SPARK_PACKAGES}
      - /app/stream_job.py
    volumes:
      - ./spark:/app:ro
      - spark-ivy:/tmp/ivy
      - spark-checkpoints:/data/checkpoints
    mem_limit: ${SPARK_CONTAINER_MEMORY:-3g}
    restart: unless-stopped

  # Nightly maintenance: deletes expired bronze/silver data, builds the daily
  # AS-link summary, compacts the Delta tables. Runs once and exits; the
  # scheduler container below starts it every night. Run by hand with:
  #   docker compose run --rm maintenance
  maintenance:
    <<: *spark-base
    profiles: ["ops"]
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[2]
      - --driver-memory=${SPARK_DRIVER_MEMORY:-2g}
      - --driver-java-options=-Duser.timezone=UTC
      - --conf=spark.jars.ivy=/tmp/ivy
      - --packages=${SPARK_PACKAGES}
      - /app/maintenance.py
    restart: "no"

  # Tiny cron container that triggers `maintenance` on a schedule through the
  # Docker socket. Schedule is in .env (MAINTENANCE_CRON, default 03:15 UTC).
  scheduler:
    image: docker:27-cli
    depends_on:
      spark:
        condition: service_started
    environment:
      MAINTENANCE_CRON: ${MAINTENANCE_CRON:-15 3 * * *}
      COMPOSE_PROJECT_NAME: bgp-pipeline
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$MAINTENANCE_CRON cd /workspace && docker compose --profile ops run --rm --no-deps maintenance >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "scheduler: maintenance at '$$MAINTENANCE_CRON' (UTC)"
        exec crond -f -l 6
    restart: unless-stopped

  producer:
    build: ./producer
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      RIS_CLIENT: ${RIS_CLIENT}
      RIS_HOSTS: ${RIS_HOSTS:-}
      SAMPLE_EVERY: ${SAMPLE_EVERY:-50}
    mem_limit: 256m
    restart: unless-stopped

  # Web UI to look at topics and messages. Local use only:
  #   docker compose --profile tools up -d console   ->  http://localhost:8080
  console:
    image: docker.redpanda.com/redpandadata/console:${CONSOLE_VERSION:-v2.7.2}
    profiles: ["tools"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redpanda-data:
  postgres-data:
  lake-data:          # SeaweedFS data (bronze, silver, gold)
  spark-checkpoints:  # streaming progress; must be reset together with the lake
  s3-config:
  spark-ivy:
